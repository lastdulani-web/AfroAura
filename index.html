<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#018081">
<title>AfroAura</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AfroAura">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{--bg:#E1F9F4;--fg:#0b3b3c;--bar:#018081;--bf:#E1F9F4;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--fg);-webkit-tap-highlight-color:transparent}
body[data-t=sepia]{--bg:#f3ead6;--fg:#4a3a2a;--bar:#7a6247;--bf:#f3ead6}
body[data-t=night]{--bg:#0d2526;--fg:#cfe7e3;--bar:#143a3b;--bf:#cfe7e3}
button,select{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,select:focus-visible,label:focus-within{outline:3px solid currentColor;outline-offset:2px}
.top{background:var(--bar);color:var(--bf);padding:calc(14px + env(safe-area-inset-top)) 18px 14px;display:flex;align-items:center;justify-content:space-between}
.logo{font:800 28px Georgia,serif;letter-spacing:-.5px}
.pill{background:var(--bf);color:var(--bar);padding:9px 18px;border-radius:99px;font-weight:600;cursor:pointer}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:22px 16px;padding:20px 18px}
.cv{display:block;width:100%;aspect-ratio:2/3;background:var(--bar);color:var(--bf);border-radius:4px 10px 10px 4px;overflow:hidden;font:700 17px/1.2 Georgia,serif;text-align:left;padding:12px;box-shadow:inset 5px 0 0 rgba(0,0,0,.18)}
.cv img{width:calc(100% + 24px);height:calc(100% + 24px);margin:-12px;object-fit:cover;display:block}
.card .t{font-weight:600;margin-top:8px;font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .a{font-size:12px;opacity:.7}
.pb{height:4px;background:color-mix(in srgb,var(--fg) 15%,transparent);border-radius:2px;margin:6px 0}
.pb i{display:block;height:100%;background:var(--bar);border-radius:2px}
.rm{font-size:12px;opacity:.6;text-decoration:underline}
#empty{padding:56px 28px;text-align:center;max-width:420px;margin:auto}
#empty h2{font:700 22px Georgia,serif;margin-bottom:8px}
.credit{text-align:center;font-size:12px;opacity:.55;padding:24px 0 32px}
#reader{position:fixed;inset:0;background:var(--bg)}
#viewer{position:absolute;inset:calc(34px + env(safe-area-inset-top)) 14px calc(34px + env(safe-area-inset-bottom))}
.bar{position:absolute;left:0;right:0;background:var(--bar);color:var(--bf);transition:opacity .2s;z-index:5}
.bar.off{opacity:0;pointer-events:none}
#bt{top:0;display:flex;align-items:center;gap:4px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px}
#bt button{padding:8px 10px;border-radius:8px;font-weight:600}
#bt .sp{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;font-size:14px;opacity:.85}
#bf{bottom:0;padding:8px 16px calc(10px + env(safe-area-inset-bottom));font-size:13px}
#bf .r{display:flex;justify-content:space-between;gap:12px}
#ch{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sl{width:100%;accent-color:var(--bf);margin-top:4px}
#bd{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:8}
.pn{position:fixed;z-index:9;background:var(--bg);color:var(--fg);box-shadow:0 0 30px rgba(0,0,0,.35)}
#toc{top:0;bottom:0;left:0;width:min(88vw,350px);overflow:auto;padding-top:env(safe-area-inset-top)}
#toc .tabs{display:flex;position:sticky;top:0;background:var(--bar);color:var(--bf)}
#toc .tabs button{flex:1;padding:14px;font-weight:600;opacity:.6}
#toc .tabs button[aria-selected=true]{opacity:1;box-shadow:inset 0 -3px 0 var(--bf)}
#toc .l button{display:block;width:100%;text-align:left;padding:12px 16px;border-bottom:1px solid color-mix(in srgb,var(--fg) 12%,transparent);font-size:15px}
.none{padding:20px 16px;opacity:.7}
#set{left:0;right:0;bottom:0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));border-radius:18px 18px 0 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.row b{font-weight:600}
.seg{display:flex;gap:8px}
.seg button,.seg select{padding:9px 14px;border-radius:10px;border:2px solid var(--bar);background:var(--bg)}
.seg button[aria-pressed=true]{background:var(--bar);color:var(--bf)}
#ts{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;opacity:0;transition:.2s;z-index:20;pointer-events:none}
#ts.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
#reader{overflow:hidden}
#gest{position:absolute;inset:0;z-index:3;touch-action:none}
#viewer{inset:calc(62px + env(safe-area-inset-top)) 16px calc(80px + env(safe-area-inset-bottom))}
#bt{gap:2px;padding:calc(6px + env(safe-area-inset-top)) 6px 6px}
#bt button{width:42px;height:42px;padding:0;display:grid;place-items:center;border-radius:10px;flex:none}
#bt svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bt .sp{font-size:15px;font-weight:600;text-align:left;padding:0 6px;opacity:1}
#mk.on svg{fill:currentColor}
#bf{padding:10px 20px calc(12px + env(safe-area-inset-bottom))}
#ch{padding-left:2px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:38px;height:38px;padding:4px;background:#E1F9F4;border-radius:11px;object-fit:contain}
#splash{position:fixed;inset:0;z-index:100;background:#E1F9F4;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .35s}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:min(44vw,180px);animation:pop .8s ease-out both}
#splash .n{font:800 36px Georgia,serif;color:#018081;margin-top:18px;animation:pop .8s .15s ease-out both}
#splash .d{position:absolute;bottom:calc(38px + env(safe-area-inset-bottom));font-size:14px;color:#0b3b3c;opacity:.75;letter-spacing:.3px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#splash img,#splash .n{animation:none}}
:root{--acc:#A8F2E3}
.top{border-bottom:3px solid var(--acc)}
.logo{font:700 25px/1 system-ui,-apple-system,sans-serif;letter-spacing:-.3px;color:#fff}
.logo b{color:var(--acc);font-weight:700}
.icbtn{width:46px;height:46px;border:1.5px solid color-mix(in srgb,var(--bf) 65%,transparent);border-radius:13px;color:var(--bf);display:grid;place-items:center}
.icbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2}
.welcome{margin:22px 16px;padding:30px 18px 22px;border:1px solid color-mix(in srgb,var(--fg) 16%,transparent);border-radius:28px;background:color-mix(in srgb,var(--fg) 4%,transparent);text-align:center}
.wl{width:96px;height:100px;object-fit:contain}
.welcome h1{font:700 34px/1.1 system-ui,-apple-system,sans-serif;margin:14px 0 4px}
.tg{opacity:.8;font-size:19px;margin-bottom:20px}
.btn{display:inline-block;background:var(--bar);color:var(--bf);padding:14px 28px;border-radius:14px;font-weight:600;font-size:19px;cursor:pointer}
.btn:focus-within{outline:3px solid currentColor;outline-offset:3px}
.pv{font-size:14px;opacity:.65;margin:20px 8px 0}
#rec{text-align:left;margin-top:26px}
#rec h2{font:600 19px system-ui,-apple-system,sans-serif;margin-bottom:4px}
#grid{padding:14px 0 6px}
#lib.has .wl{width:56px;height:60px}
#lib.has .welcome h1{font-size:26px;margin-bottom:14px}
#lib.has .tg{display:none}
.credit{font-size:14px;padding:20px 0 0}
#splash{background:#018081;padding-bottom:5vh}
#splash img{width:96px;height:96px;padding:14px;background:#E1F9F4;border-radius:27px;object-fit:contain;animation:pop .8s ease-out both}
#splash .n{font:700 40px/1.1 system-ui,-apple-system,sans-serif;color:#fff;margin-top:22px;letter-spacing:-.4px;animation:pop .8s .12s ease-out both}
#splash .n b{color:var(--acc);font-weight:700}
#splash .d{position:static;font-size:17px;color:rgba(255,255,255,.8);opacity:1;margin-top:14px;letter-spacing:0;animation:pop .8s .25s ease-out both}
.top{position:sticky;top:0;z-index:10}
#grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 12px}
.card{position:relative}
.card .t{font-size:13px;margin-top:6px}
.card .a{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv{padding:8px;font-size:12px;border-radius:3px 8px 8px 3px}
.cv img{width:calc(100% + 16px);height:calc(100% + 16px);margin:-8px}
.rm{position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;opacity:1;text-decoration:none;display:grid;place-items:center}
.rm svg{width:18px;height:18px;fill:currentColor}
#viewer{inset:calc(62px + env(safe-area-inset-top)) 16px calc(46px + env(safe-area-inset-bottom))}
#bf{padding:9px 18px calc(9px + env(safe-area-inset-bottom));font-size:13px}
#pc{white-space:nowrap;font-variant-numeric:tabular-nums}
#set #sl{flex:1;margin:0;accent-color:var(--bar)}
.rh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:2px}
.rh select{font-size:14px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--bar);background:var(--bg);color:var(--fg);max-width:50%}
</style>
</head>
<body data-t="day">
<div id="splash"><img src="logo.png" alt=""><div class="n">Afro<b>Aura</b></div><div class="d">Developed by Last Dulani</div></div>

<main id="lib">
  <div class="top">
    <span class="brand"><img src="logo.png" alt=""><span class="logo">Afro<b>Aura</b></span></span>
    <button id="th2" class="icbtn" aria-label="Switch light or dark mode"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 010 18z" fill="currentColor"/></svg></button>
  </div>
  <section class="welcome">
    <img class="wl" src="logo.png" alt="">
    <h1>Welcome</h1>
    <p class="tg">Read your books for free.</p>
    <label class="btn">Add books<input id="add" type="file" multiple hidden></label>
    <p class="pv">Your books stay on your phone. They are not uploaded.</p>
    <div id="rec" hidden><div class="rh"><h2>Your books</h2><select id="sort" aria-label="Sort books"><option value="recent">Recently read</option><option value="title">Title, A to Z</option><option value="author">Author, A to Z</option><option value="added">Date added</option><option value="progress">Most read</option></select></div><div id="grid"></div></div>
    <p class="credit">AfroAura developed by Last Dulani</p>
  </section>
</main>

<section id="reader" hidden>
  <div id="bt" class="bar">
    <button id="bk" aria-label="Back to library"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="sp" id="tt"></span>
    <button id="th" aria-label="Switch light or dark mode"><svg viewBox="0 0 24 24"><path id="thp" d=""/></svg></button>
    <button id="mk" aria-label="Bookmark this page"><svg viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></svg></button>
    <button id="co" aria-label="Contents and bookmarks"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
    <button id="aa" aria-label="Reading settings"><svg viewBox="0 0 24 24"><path d="M2 19l5-13 5 13M4 14h6M14 19l3.5-9 3.5 9M15.5 16.5h4"/></svg></button>
  </div>
  <div id="viewer"></div>
  <div id="gest"></div>
  <div id="bf" class="bar"><div class="r"><span id="ch"></span><span id="pc">0%</span></div></div>
</section>

<div id="bd" hidden></div>
<aside id="toc" class="pn" hidden>
  <div class="tabs" role="tablist">
    <button role="tab" id="t1" aria-selected="true">Contents</button>
    <button role="tab" id="t2" aria-selected="false">Bookmarks</button>
  </div>
  <div id="tl" class="l"></div>
  <div id="bl" class="l" hidden></div>
</aside>
<aside id="set" class="pn" hidden>
  <div class="row"><b>Go to</b><input id="sl" type="range" min="0" max="100" value="0" disabled aria-label="Jump to a place in the book"></div>
  <div class="row"><b>Theme</b>
    <div class="seg"><button data-th="day">Mint</button><button data-th="sepia">Sepia</button><button data-th="night">Night</button></div></div>
  <div class="row"><b>Reading</b>
    <div class="seg"><button data-md="page">Swipe pages</button><button data-md="scroll">Scroll</button></div></div>
  <div class="row"><b>Text size</b>
    <div class="seg"><button id="zm" aria-label="Smaller text">A-</button><span id="zv" style="min-width:44px;text-align:center"></span><button id="zp" aria-label="Larger text">A+</button></div></div>
  <div class="row"><b>Font</b>
    <div class="seg"><select id="ff"><option value="Georgia,serif">Georgia</option><option value="system-ui,sans-serif">Clean sans</option><option value="Palatino,'Palatino Linotype',serif">Palatino</option></select></div></div>
</aside>
<div id="ts" role="status"></div>

<script>
// loads the reading engine, trying a backup source if the first one fails
const libs=(async()=>{
  const get=u=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=no;document.head.append(e)});
  const first=async l=>{for(const u of l){try{await get(u);return}catch(_){}}};
  await first(['https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js','https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js']);
  await first(['https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js','https://unpkg.com/epubjs@0.3.93/dist/epub.min.js']);
})();
const engineOK=async()=>{await libs;return typeof ePub!=='undefined'&&typeof JSZip!=='undefined'};
</script>
<script>
const $=s=>document.querySelector(s),D=document;
let db,book,rend,rec,ready,sv,sx=0,sy=0,lock=null,drag=0,busy=false;
let S=Object.assign({t:'day',z:100,f:'Georgia,serif',m:'page',s:'recent'},JSON.parse(localStorage.aa||'{}'));
const TH={day:['#E1F9F4','#0b3b3c'],sepia:['#f3ead6','#4a3a2a'],night:['#0d2526','#cfe7e3']};
const MOON='M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z';
const SUN='M12 8a4 4 0 100 8 4 4 0 000-8zM12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4';

const openDB=()=>new Promise((res,rej)=>{const r=indexedDB.open('afroaura',1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('books',{keyPath:'id'});r.result.createObjectStore('files')};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=(st,m,f)=>new Promise((res,rej)=>{const t=db.transaction(st,m),r=f(t.objectStore(st));
  t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)});
function toast(m){const t=$('#ts');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600)}

function look(){
  D.body.dataset.t=S.t;localStorage.aa=JSON.stringify(S);
  $('#zv').textContent=S.z+'%';$('#ff').value=S.f;$('#thp').setAttribute('d',S.t==='night'?SUN:MOON);D.querySelectorAll('[data-md]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.md===S.m));
  D.querySelectorAll('[data-th]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.th===S.t));
  if(rend){const[b,f]=TH[S.t];rend.themes.override('color',f);rend.themes.override('background',b);rend.themes.fontSize(S.z+'%');rend.themes.font(S.f)}
}

const SORTS={
  recent:(a,b)=>(b.opened||0)-(a.opened||0),
  title:(a,b)=>a.title.localeCompare(b.title,undefined,{sensitivity:'base',numeric:true}),
  author:(a,b)=>(a.author||'~').localeCompare(b.author||'~',undefined,{sensitivity:'base'})||a.title.localeCompare(b.title),
  added:(a,b)=>(b.added||0)-(a.added||0),
  progress:(a,b)=>(b.pct||0)-(a.pct||0)};
async function shelf(){
  const bs=(await tx('books','readonly',s=>s.getAll())).sort(SORTS[S.s]||SORTS.recent);
  const g=$('#grid');g.innerHTML='';$('#rec').hidden=!bs.length;$('#lib').classList.toggle('has',bs.length>0);
  bs.forEach(b=>{
    const c=D.createElement('div');c.className='card';
    const o=D.createElement('button');o.className='cv';o.setAttribute('aria-label','Open '+b.title);
    if(b.cover){const i=new Image();i.alt='';i.src=URL.createObjectURL(b.cover);o.append(i)}else o.textContent=b.title;
    o.onclick=()=>openBook(b.id);
    c.innerHTML='<p class="t"></p><p class="a"></p><div class="pb"><i></i></div><button class="rm" aria-label="Remove book"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>';
    c.querySelector('.t').textContent=b.title;
    c.querySelector('.a').textContent=b.author||'';
    c.querySelector('.pb i').style.width=(b.pct||0)+'%';
    c.querySelector('.rm').onclick=async()=>{
      if(confirm('Remove "'+b.title+'" from your shelf?')){
        await tx('books','readwrite',s=>s.delete(b.id));await tx('files','readwrite',s=>s.delete(b.id));shelf()}};
    c.prepend(o);g.append(c);
  });
}

$('#add').onchange=async e=>{
  if(!await engineOK()){toast('Reader engine could not load. Check your internet and reload.');return}
  for(const f of e.target.files){
    try{
      if(!/\.epub$/i.test(f.name))throw new Error('not an .epub file');
      const buf=await f.arrayBuffer(),bk=ePub(buf,{openAs:'binary'}),m=await bk.loaded.metadata;
      const r={id:Date.now()+Math.random().toString(36).slice(2),title:m.title||f.name.replace(/\.epub$/i,''),author:m.creator||'',added:Date.now(),opened:0,pct:0,marks:[]};
      try{const u=await bk.coverUrl();if(u)r.cover=await(await fetch(u)).blob()}catch(_){}
      await tx('files','readwrite',s=>s.put(buf,r.id));
      await tx('books','readwrite',s=>s.put(r));
      bk.destroy();
    }catch(err){console.error(err);toast('Could not add '+f.name+': '+(err&&err.message||err))}
  }
  e.target.value='';shelf();
};

const show=v=>{$('#lib').hidden=v!=='lib';$('#reader').hidden=v!=='reader'};
const save=()=>{clearTimeout(sv);sv=setTimeout(()=>tx('books','readwrite',s=>s.put(rec)),400)};

async function openBook(id){
  try{await openBook2(id)}catch(err){localStorage.removeItem('aa_in');console.error(err);toast('Could not open book: '+(err&&err.message||err));show('lib')}
}
async function openBook2(id){
  if(!await engineOK())throw new Error('reader engine not loaded');
  rec=await tx('books','readonly',s=>s.get(id));
  const buf=await tx('files','readonly',s=>s.get(id));
  if(!buf){localStorage.removeItem('aa_in');toast('This book file is missing');return}
  try{const pr=JSON.parse(localStorage.getItem('aap_'+id)||'null');if(pr&&pr.c){rec.cfi=pr.c;rec.pct=pr.p||rec.pct||0}}catch(_){}
  localStorage.aa_in=id;rec.opened=Date.now();ready=false;
  show('reader');$('#tt').textContent=rec.title;$('#tl').innerHTML='';$('#sl').disabled=true;$('#sl').value=rec.pct||0;$('#pc').textContent=(rec.pct||0)+'%';
  bars(true);
  book=ePub(buf,{openAs:'binary'});
  rend=null;
  await mount();
  book.loaded.navigation.then(n=>toc(n.toc));
  marks();
  book.ready.then(()=>book.locations.generate(1000)).then(()=>{ready=true;$('#sl').disabled=false;move(rend.currentLocation())});
}

function persist(){
  if(!rec)return;
  try{localStorage.setItem('aap_'+rec.id,JSON.stringify({c:rec.cfi,p:rec.pct,t:Date.now()}));localStorage.aa_in=rec.id}catch(_){}
}
function flush(){
  if(!rec||!book)return;
  persist();clearTimeout(sv);
  try{tx('books','readwrite',s=>s.put(rec))}catch(_){}
}
D.addEventListener('visibilitychange',()=>{if(D.hidden)flush()});
addEventListener('pagehide',flush);
function move(l){
  if(!l||!l.start)return;
  rec.cfi=l.start.cfi;
  if(ready){rec.pct=Math.round(book.locations.percentageFromCfi(rec.cfi)*100)||0;$('#sl').value=rec.pct}
  let pg='';
  if(ready){const L=book.locations,i=L.locationFromCfi(rec.cfi);pg=' | Page '+((i>0?i:0)+1)+' of '+L.length()}
  $('#pc').textContent=(rec.pct||0)+'%'+pg;
  const c=book.navigation&&book.navigation.get(l.start.href);
  $('#ch').textContent=c?c.label.trim():'';
  $('#mk').classList.toggle('on',rec.marks.some(m=>m.cfi===rec.cfi));
  persist();save();
}

function tap(e){
  if(busy)return;
  const x=e.clientX/window.innerWidth;
  if(x<.3)flip(-1);else if(x>.7)flip(1);else bars();
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function mount(){
  if(rend){try{rend.destroy()}catch(_){}$('#viewer').innerHTML=''}
  const sc=S.m==='scroll';
  rend=book.renderTo('viewer',sc?{manager:'continuous',flow:'scrolled',width:'100%',height:'100%'}:{width:'100%',height:'100%',flow:'paginated',spread:'none'});
  rend.on('relocated',move);rend.on('keyup',key);
  rend.on('click',()=>{if(S.m==='scroll'&&!busy)bars()});
  $('#gest').hidden=sc;
  look();
  await rend.display(rec.cfi||undefined);
}
async function flip(dir){
  if(busy||!rend)return;busy=true;
  const v=$('#viewer'),w=v.clientWidth;
  try{
    v.style.transition='transform .16s ease-out';v.style.transform='translateX('+(-dir*w)+'px)';
    await wait(160);
    await(dir>0?rend.next():rend.prev());
    v.style.transition='none';v.style.transform='translateX('+(dir*w)+'px)';void v.offsetWidth;
    v.style.transition='transform .2s ease-out';v.style.transform='none';
    await wait(200);
  }catch(_){v.style.transition='none';v.style.transform='none'}
  busy=false;
}
function bars(on){const off=on===undefined?!$('#bt').classList.contains('off'):!on;
  $('#bt').classList.toggle('off',off);$('#bf').classList.toggle('off',off)}
function key(e){if(S.m==='scroll')return;if(e.key==='ArrowRight')flip(1);if(e.key==='ArrowLeft')flip(-1)}
D.addEventListener('keyup',e=>{if(rend&&!$('#reader').hidden)key(e)});

$('#sl').onchange=e=>{if(ready)rend.display(book.locations.cfiFromPercentage(e.target.value/100))};

$('#bk').onclick=async()=>{
  localStorage.removeItem('aa_in');clearTimeout(sv);await tx('books','readwrite',s=>s.put(rec));
  closeP();book.destroy();rend=book=null;$('#viewer').innerHTML='';$('#viewer').style.transform='none';busy=false;show('lib');shelf();
};

function toc(t,d=0){
  const l=$('#tl');
  t.forEach(i=>{const b=D.createElement('button');b.textContent=i.label.trim();b.style.paddingLeft=(16+d*16)+'px';
    b.onclick=()=>{rend.display(i.href);closeP()};l.append(b);
    if(i.subitems&&i.subitems.length)toc(i.subitems,d+1)});
}

$('#mk').onclick=()=>{
  const i=rec.marks.findIndex(m=>m.cfi===rec.cfi);
  if(i>-1)rec.marks.splice(i,1);else rec.marks.push({cfi:rec.cfi,label:$('#ch').textContent||'Page',pct:rec.pct||0});
  $('#mk').classList.toggle('on',i<0);save();marks();
};
function marks(){
  const l=$('#bl');l.innerHTML='';
  if(!rec.marks.length){l.innerHTML='<p class="none">No bookmarks yet. Tap Mark while you read.</p>';return}
  rec.marks.forEach(m=>{const b=D.createElement('button');b.textContent=m.label+', '+m.pct+'%';
    b.onclick=()=>{rend.display(m.cfi);closeP()};l.append(b)});
}

function openP(id){$('#bd').hidden=false;$(id).hidden=false}
function closeP(){$('#bd').hidden=true;$('#toc').hidden=true;$('#set').hidden=true}
$('#bd').onclick=closeP;
$('#co').onclick=()=>openP('#toc');
$('#aa').onclick=()=>openP('#set');
[['#t1','#tl','#bl'],['#t2','#bl','#tl']].forEach(([t,a,b])=>$(t).onclick=()=>{
  $(a).hidden=false;$(b).hidden=true;
  $('#t1').setAttribute('aria-selected',t==='#t1');$('#t2').setAttribute('aria-selected',t==='#t2')});

D.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{S.t=b.dataset.th;look()});
D.querySelectorAll('[data-md]').forEach(b=>b.onclick=async()=>{
  if(S.m===b.dataset.md)return;S.m=b.dataset.md;look();if(book){closeP();await mount()}});
$('#th').onclick=$('#th2').onclick=()=>{S.t=S.t==='night'?'day':'night';look()};
$('#sort').onchange=e=>{S.s=e.target.value;look();shelf()};
let px=0,py=0,pid=null,pt=0;
const G=$('#gest'),snap=()=>{const v=$('#viewer');v.style.transition='transform .18s ease-out';v.style.transform='none'};
G.onpointerdown=e=>{if(busy)return;pid=e.pointerId;px=e.clientX;py=e.clientY;pt=Date.now();lock=null;drag=0;try{G.setPointerCapture(pid)}catch(_){}};
G.onpointermove=e=>{
  if(e.pointerId!==pid)return;
  const dx=e.clientX-px,dy=e.clientY-py;
  if(lock===null&&(Math.abs(dx)>8||Math.abs(dy)>8))lock=Math.abs(dx)>Math.abs(dy);
  if(lock){drag=dx;const v=$('#viewer');v.style.transition='none';v.style.transform='translateX('+dx+'px)'}};
G.onpointerup=async e=>{
  if(e.pointerId!==pid)return;pid=null;
  if(lock){
    const w=$('#viewer').clientWidth,fast=Date.now()-pt<280&&Math.abs(drag)>30;
    lock=null;
    if(Math.abs(drag)>w*.2||fast)await flip(drag<0?1:-1);else snap();
    return}
  if(Math.abs(e.clientX-px)<8&&Math.abs(e.clientY-py)<8)tap(e)};
G.onpointercancel=()=>{pid=null;if(lock){lock=null;snap()}};
$('#zm').onclick=()=>{S.z=Math.max(70,S.z-10);look()};
$('#zp').onclick=()=>{S.z=Math.min(220,S.z+10);look()};
$('#ff').onchange=e=>{S.f=e.target.value;look()};

setTimeout(()=>{const p=$('#splash');p.classList.add('out');setTimeout(()=>p.remove(),400)},1800);
(async()=>{
  db=await openDB();look();$('#sort').value=S.s;await shelf();
  const li=localStorage.aa_in;if(li)openBook(li);
  if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
